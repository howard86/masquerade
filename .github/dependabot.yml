# Dependabot configuration for Flutter project
version: 2
updates:
  # Enable version updates for Dart/Flutter dependencies
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Group all pub bumps into ONE weekly PR (no more one-PR-per-dep churn, and
    # grouped PRs are reviewed rather than blindly auto-merged).
    groups:
      pub-dependencies:
        patterns:
          - "*"
    assignees:
      - "howard86"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    labels:
      - "dependencies"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    # One weekly PR for all GitHub Actions bumps.
    groups:
      github-actions:
        patterns:
          - "*"
    assignees:
      - "howard86"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
