name: iOS unsigned release validation

on:
  push:
    branches:
      - fix/release-fastlane-path

permissions:
  contents: read

concurrency:
  group: ios-unsigned-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned:
    name: Build and validate unsigned iOS app
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | awk '/^Xcode / { print $2; exit }')" = "26.6"
          sdk_version="$(xcodebuild -version -sdk iphoneos SDKVersion)"
          echo "iOS SDK $sdk_version"
          test "$sdk_version" = "26.5"

      - name: Check Apple trust roots for profile CMS validation
        run: |
          roots="$RUNNER_TEMP/apple-root-ca.pem"
          security find-certificate -a -p -c "Apple Root CA" \
            /System/Library/Keychains/SystemRootCertificates.keychain > "$roots"
          grep -q -- "-----BEGIN CERTIFICATE-----" "$roots"
          openssl x509 -in "$roots" -noout >/dev/null

      - name: Set up Ruby for the Fastfile regression test
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Verify Fastlane version lookup from another working directory
        run: ruby ios/fastlane/test_fastfile_version_path.rb

      - name: Test Fastlane release safety wiring
        run: ruby ios/fastlane/test_fastfile_release_safety.rb

      - name: Test unsigned artifact validator
        run: python3 ios/fastlane/test_unsigned_app_validation.py

      - name: Test signed IPA validator decision logic
        run: python3 ios/fastlane/test_signed_ipa_validation.py

      - name: Set up Flutter 3.41.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.8"
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: |
          test "$(flutter --version --machine | python3 -c 'import json, sys; print(json.load(sys.stdin)["frameworkVersion"])')" = "3.41.8"
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.yaml pubspec.lock

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Flutter project
        run: flutter analyze --no-pub

      - name: Run full Flutter test suite
        run: flutter test --no-pub --coverage --concurrency=4

      - name: Build release web app
        run: flutter build web --release --no-pub

      - name: Build release app without signing
        run: flutter build ios --release --no-codesign --no-pub

      - name: Package and validate the unsigned app artifact
        run: |
          app="$GITHUB_WORKSPACE/build/ios/iphoneos/Runner.app"
          extension="$app/PlugIns/ShareExtension.appex"
          # Check only the top-level app and extension; vendored frameworks
          # inside a no-codesign build may carry their own platform signatures.
          if codesign -dv "$app" 2>/dev/null || codesign -dv "$extension" 2>/dev/null; then
            echo "::error::The validation artifact must be unsigned."
            exit 1
          fi

          archive="$GITHUB_WORKSPACE/build/ios/Runner-unsigned.tar.gz"
          roundtrip="$GITHUB_WORKSPACE/build/ios/artifact-roundtrip"
          mkdir -p "$roundtrip"
          tar -czf "$archive" -C "$(dirname "$app")" "$(basename "$app")"
          tar -xzf "$archive" -C "$roundtrip"

          python3 - "$app" "$roundtrip/Runner.app" <<'PY'
          import hashlib
          import os
          import stat
          import sys
          from pathlib import Path

          def snapshot(root):
              entries = {}
              for path in root.rglob("*"):
                  relative = path.relative_to(root).as_posix()
                  mode = stat.S_IMODE(path.lstat().st_mode)
                  if path.is_symlink():
                      entries[relative] = ("symlink", mode, os.readlink(path))
                  elif path.is_dir():
                      entries[relative] = ("directory", mode)
                  else:
                      digest = hashlib.sha256()
                      with path.open("rb") as stream:
                          for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                              digest.update(chunk)
                      entries[relative] = ("file", mode, digest.hexdigest())
              return entries

          original, extracted = map(Path, sys.argv[1:])
          before = snapshot(original)
          after = snapshot(extracted)
          if before != after:
              missing = sorted(set(before) - set(after))
              added = sorted(set(after) - set(before))
              changed = sorted(path for path in before.keys() & after.keys() if before[path] != after[path])
              raise SystemExit(f"archive round-trip changed app entries: missing={missing}, added={added}, changed={changed}")
          print(f"Archive round-trip preserved {len(before)} files/links and their modes.")
          PY

          extracted_app="$roundtrip/Runner.app"
          if codesign -dv "$extracted_app" 2>/dev/null || codesign -dv "$extracted_app/PlugIns/ShareExtension.appex" 2>/dev/null; then
            echo "::error::Extracted validation artifact must remain unsigned."
            exit 1
          fi
          python3 ios/fastlane/validate_unsigned_app.py "$extracted_app" \
            | tee build/ios/unsigned-validation.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-validation-1.29.0-${{ github.sha }}
          # The tar preserves executable bits and symlinks; the validation
          # report is plain JSON. Don't upload Runner.app directly here.
          path: |
            build/ios/Runner-unsigned.tar.gz
            build/ios/unsigned-validation.json
          if-no-files-found: error
          retention-days: 3
