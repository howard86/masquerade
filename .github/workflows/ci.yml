name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent overlapping runs on the same ref (useful on PR update storms)
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  # Pin the Flutter channel and version
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.41.8"
  # Skip Flutter analytics in CI
  CI: true

jobs:
  release-source-policy:
    name: Release source policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Require the release-please branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release-please--branches--develop--*) ;;
            *)
              echo "::error::PRs to main must come from release-please for develop."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require current develop ancestry
        run: |
          git fetch origin develop
          git merge-base --is-ancestor origin/develop HEAD || {
            echo "::error::The release branch does not contain current develop."
            exit 1
          }

  # Pre-commit checks (run first)
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  # Code analysis and tests
  analyze-and-test:
    name: Analyze and Test
    runs-on: ubuntu-latest
    needs: pre-commit

    steps:
      - uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Verify the formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      # Catches web-only regressions (manifest, splash injection, asset
      # paths, tree-shake-icons). Output is discarded — gate only.
      - name: Build web (release)
        run: flutter build web --release

  # Security scan
  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: analyze-and-test

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # main only ever receives release-please's Release PR, retargeted from develop
  # (see release.yml), so a green main means a new version just landed -- ship it.
  # Skipped entirely on develop and on PRs.
  #
  # Requires these repository secrets (none are set yet -- the job fails at the
  # signing step until they are):
  #   ASC_KEY_ID, ASC_ISSUER_ID  -- App Store Connect API key identifiers
  #   ASC_KEY_P8                 -- the .p8 private key, base64-encoded
  #   IOS_DIST_CERT_P12          -- Apple Distribution cert + key, base64-encoded
  #   IOS_DIST_CERT_PASSWORD     -- password protecting that .p12
  deploy-ios:
    name: Deploy to TestFlight
    runs-on: macos-latest
    needs: [analyze-and-test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      # `flutter build ipa` has no --no-codesign and would try to sign the archive
      # with automatic signing, which needs an Xcode account this runner lacks --
      # and it exits 0 when the export fails, hiding it. Build unsigned and let
      # fastlane archive/sign/export instead.
      #
      # --build-number overrides pubspec's +N: release-please rewrites that line
      # every release, and TestFlight rejects a build number it has already seen.
      # run_number is monotonic and is already past the builds uploaded by hand.
      - name: Build (unsigned)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: ios
          bundler-cache: true

      - name: Upload to TestFlight
        run: bundle exec fastlane beta
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
