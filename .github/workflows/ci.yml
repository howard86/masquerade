name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Prevent overlapping runs on the same ref (useful on PR update storms)
concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  # Pin the Flutter channel and version
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.41.8"
  # Skip Flutter analytics in CI
  CI: true

jobs:
  # Gated on the head branch as well as the base: release.yml moves the Release
  # PR's base to main and then closes/reopens it to restart the checks, but the
  # run for the original `opened` event can materialise after that reopen and
  # cancel the reopen's run through the concurrency group above -- leaving the
  # final status from a base=develop payload, with this job skipped. Both
  # assertions below hold whatever the base is, so keying on the release-please
  # head branch too means the race cannot leave the gate unrun. Feature PRs to
  # develop still skip it.
  release-source-policy:
    name: Release source policy
    if: >-
      github.event_name == 'pull_request' &&
      (github.base_ref == 'main' ||
       startsWith(github.head_ref, 'release-please--branches--develop'))
    runs-on: ubuntu-latest

    steps:
      - name: Require the release-please branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release-please--branches--develop--*) ;;
            *)
              echo "::error::PRs to main must come from release-please for develop."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Require current develop ancestry
        run: |
          git fetch origin develop
          git merge-base --is-ancestor origin/develop HEAD || {
            echo "::error::The release branch does not contain current develop."
            exit 1
          }

  # Pre-commit checks. Runs the repo-hygiene hooks only -- dart format and
  # flutter analyze are skipped here because analyze owns them.
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files
        env:
          SKIP: dart-format,flutter-analyze

  # Format + analyze: fast, and independent of the test shards.
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify the formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

  # The suite is the CI critical path (224s of a 275s job) and the hosted runner
  # is already CPU-saturated around -j2, so raising --concurrency buys almost
  # nothing -- measured, it was only -9%. Sharding adds runners instead.
  #
  # --shard-index is 0-based (flutter_tools rejects < 0). The three shards were
  # verified locally to cover the whole suite exactly: 441 + 435 + 440 = 1316
  # tests, 2 skipped, with even 20s/20s/19s balance.
  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      # One failing shard must not cancel the others -- we want the full picture.
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage --concurrency=4 --total-shards=3 --shard-index=${{ matrix.shard }}

      # Codecov merges multiple uploads for the same commit; each shard needs a
      # distinct name or they are treated as re-uploads of one report.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: shard-${{ matrix.shard }}
          fail_ci_if_error: false

  # Build web
  build-web:
    name: Build web
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow defaults wholesale, so
    # contents: read has to be restated alongside the comment permission.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install dependencies
        run: flutter pub get
      # Catches web-only regressions (manifest, splash injection, asset
      # paths, tree-shake-icons). The output also feeds the size report below.
      - name: Build web (release)
        run: flutter build web --release

      # Free to measure: this job already builds and discards the bundle.
      # main.dart.js gzipped is the number that actually moves per PR --
      # canvaskit ships several multi-MB variants of which one loads, so it
      # swamps any real diff and is only folded into the total.
      - name: Measure bundle size
        run: |
          printf 'gzip_main\t%s\tmain.dart.js (gzip)\n' \
            "$(gzip -9c build/web/main.dart.js | wc -c)" > size.tsv
          printf 'total\t%s\tbuild/web total\n' \
            "$(du -sb build/web | cut -f1)" >> size.tsv

      # Cache entries are immutable, so the key carries the SHA and the prefix
      # restore-key picks up the most recent published baseline. PR runs can
      # read caches from the default branch, which here is develop.
      - name: Restore size baseline
        uses: actions/cache/restore@v6
        with:
          path: baseline.tsv
          key: websize-${{ github.sha }}
          restore-keys: websize-

      - name: Report bundle size
        run: |
          bash .github/scripts/bundle-size.sh "Web bundle size" \
            | tee size-report.md >> "$GITHUB_STEP_SUMMARY"

      # --edit-last keeps one comment updated across pushes instead of stacking
      # a new one per run; --create-if-none writes the first. No other workflow
      # comments as github-actions[bot], so --edit-last cannot hijack one.
      #
      # Fork PRs get a read-only GITHUB_TOKEN and cannot be commented on, so
      # they are skipped rather than left to fail the job.
      - name: Comment size report on the PR
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file size-report.md --edit-last --create-if-none

      - name: Publish baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: cp size.tsv baseline.tsv
      - name: Save size baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: actions/cache/save@v6
        with:
          path: baseline.tsv
          key: websize-${{ github.sha }}

  # Reports the iOS bundle size trend, one build per merged PR.
  #
  # develop pushes only, deliberately. Nothing gates on this number, so a
  # per-PR trigger would rebuild on every push of a PR to deliver a report
  # that still lands after the merge decision -- same attribution for a
  # fraction of the macOS minutes. Measured ~30s from a clean checkout
  # locally; budget 3-5 min on a cold runner (pub download, cold pod install).
  #
  # MUST stay out of ci-ok's `needs`: it is skipped on every PR, and ci-ok
  # treats a skipped dependency as failure -- listing it there blocks every PR.
  build-ios-size:
    name: iOS bundle size
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --no-codesign needs none of the ASC/cert secrets that deploy-ios wants,
      # and produces the same .app layout we measure.
      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      # App.framework/App is the Dart AOT snapshot -- the iOS counterpart to
      # main.dart.js, and the only part of the bundle a code change moves.
      # The rest of Runner.app is fixed Flutter engine weight.
      - name: Measure bundle size
        run: |
          app=build/ios/iphoneos/Runner.app
          sz() { find "$1" -type f -exec stat -f%z {} + | awk '{s+=$1} END{print s+0}'; }
          printf 'aot\t%s\tApp.framework/App (Dart AOT)\n' \
            "$(stat -f%z "$app/Frameworks/App.framework/App")" > size.tsv
          printf 'assets\t%s\tflutter_assets\n' \
            "$(sz "$app/Frameworks/App.framework/flutter_assets")" >> size.tsv
          printf 'total\t%s\tRunner.app total\n' "$(sz "$app")" >> size.tsv

      # Every run compares against the previous develop push and republishes,
      # so the baseline needs no conditional handling here.
      - name: Restore size baseline
        uses: actions/cache/restore@v6
        with:
          path: baseline.tsv
          key: iossize-${{ github.sha }}
          restore-keys: iossize-

      # Summary only: this job runs on develop pushes, where there is no PR to
      # comment on. The pre-merge signal is the web report.
      - name: Report bundle size
        run: |
          bash .github/scripts/bundle-size.sh "iOS bundle size" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish baseline
        run: cp size.tsv baseline.tsv
      - name: Save size baseline
        uses: actions/cache/save@v6
        with:
          path: baseline.tsv
          key: iossize-${{ github.sha }}

  # Security scan
  security:
    name: Security scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # The single required status check for the develop-gate / main-gate rulesets.
  # Pointing branch protection at one aggregate context means the job list above
  # (shard count in particular) can change without re-registering contexts --
  # renaming a directly-required job silently blocks every PR, and adding one
  # silently stops gating on it. Both have already happened here.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [pre-commit, analyze, test, build-web, security]
    if: always()

    steps:
      # `needs` results default to letting this job pass, so an aggregate gate
      # that does not assert on them stops gating the moment anything skips.
      # None of the five should ever skip, so treat skipped as failure too.
      - name: Fail unless every required job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::A required CI job did not succeed."
          exit 1

  # main only ever receives release-please's Release PR, retargeted from develop
  # (see release.yml), so a green main means a new version just landed -- ship it.
  # Skipped entirely on develop and on PRs.
  #
  # Requires these repository secrets (none are set yet -- the job fails at the
  # signing step until they are):
  #   ASC_KEY_ID, ASC_ISSUER_ID  -- App Store Connect API key identifiers
  #   ASC_KEY_P8                 -- the .p8 private key, base64-encoded
  #   IOS_DIST_CERT_P12          -- Apple Distribution cert + key, base64-encoded
  #   IOS_DIST_CERT_PASSWORD     -- password protecting that .p12
  deploy-ios:
    name: Deploy to TestFlight
    runs-on: macos-latest
    needs: [pre-commit, analyze, test, build-web, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: ios
          bundler-cache: true

      # App Store Connect is the only thing that knows how many builds this
      # marketing version already has, so it is what the count comes from: the
      # number restarts at 1 on every version bump and still advances if this
      # job is re-run for the same version. pubspec's +N is not consulted --
      # release-please keeps its own running total there that never resets.
      - name: Resolve the next TestFlight build number
        id: build_number
        run: bundle exec fastlane next_build_number
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

      # Generate Generated.xcconfig + run pod install, but do NOT build: fastlane's
      # build_app archives the project itself, so a full build here is compiled twice.
      # --config-only still writes the build number, which is what gym reads --
      # FLUTTER_BUILD_NUMBER feeds CFBundleVersion for Runner and, through
      # CURRENT_PROJECT_VERSION, for the ShareExtension too.
      - name: Configure Xcode project
        run: flutter build ios --release --config-only --build-number=${{ steps.build_number.outputs.value }}

      - name: Upload to TestFlight
        run: bundle exec fastlane beta
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
