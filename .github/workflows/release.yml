name: Release

# release-please on a gitflow layout (develop → main).
#
# Flow:
#   push to develop
#     → release-please opens/updates a Release PR (version bump + CHANGELOG)
#     → that PR is retargeted so base = main, making one PR that both promotes
#       develop and cuts the release
#   merge the Release PR into main
#     → release-please tags vX.Y.Z + publishes the GitHub Release on main
#     → a main → develop PR is opened so the version + manifest stay in sync
#     → CI on main goes green and deploys to TestFlight (see ci.yml)
#
# release-please cannot open a PR whose base differs from the branch it scans --
# target-branch is both -- so the develop run opens against develop and the
# retarget step below moves the base to main afterwards.
#
# Requires repo Settings → Actions → General →
#   "Allow GitHub Actions to create and approve pull requests" = enabled.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest

    steps:
      # release-please only finds -- and therefore only updates -- release PRs
      # whose base is the branch it scans. The retarget step below leaves the PR
      # based on main, so every later push to develop reported "found 0 open
      # release pull requests", force-pushed a second version bump onto the
      # branch, and left the PR title and body describing the first one. The
      # main run tags from that stale title, so v1.26.2 shipped 1.27.0 and
      # v1.27.0 shipped 1.28.0. Hand the PR back before release-please runs.
      - name: Hand the Release PR back to develop
        if: github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --base main --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--branches--develop"))]
                  | .[0].number // empty')
          if [ -z "$pr" ]; then
            echo "No retargeted release PR to hand back."
            exit 0
          fi
          gh pr edit "$pr" --base develop
          echo "Rebased PR #$pr onto develop so release-please can update it."

      # develop: open/update the Release PR. main: tag + publish the release.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Scan develop's commits so the changelog covers work not yet promoted
          # to main; on main, only tag and release what the merged PR carried.
          target-branch: ${{ github.ref_name == 'main' && 'main' || 'develop' }}
          skip-github-pull-request: ${{ github.ref_name == 'main' }}
          skip-github-release: ${{ github.ref_name == 'develop' }}
          # A PAT makes generated PRs trigger CI. Anything created with the default
          # GITHUB_TOKEN cannot trigger other workflows (GitHub's recursion guard),
          # so on the fallback path a generated PR may sit without checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please opened the PR against develop; point it at main so merging
      # promotes the code and cuts the release in a single PR. Paired with the
      # hand-back above this round-trips on every develop push -- the CI run the
      # force-push kicks off is cancelled by the reopen through ci.yml's
      # flutter-ci-refs/pull/<n>/merge concurrency group, so it costs one run.
      - name: Retarget Release PR to main
        if: github.ref_name == 'develop'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --json number,baseRefName,headRefName \
            --jq '[.[] | select(.headRefName | startswith("release-please--branches--develop"))
                       | select(.baseRefName != "main")] | .[0].number // empty')
          if [ -z "$pr" ]; then
            echo "Nothing to retarget: no release PR, or it already targets main."
            exit 0
          fi
          gh pr edit "$pr" --base main
          # Reopening emits a fresh pull_request event against the final base, so
          # main's source-policy check runs instead of retaining the develop skip.
          gh pr close "$pr"
          gh pr reopen "$pr"
          echo "Retargeted PR #$pr onto main and restarted its checks."

      # The version bump and CHANGELOG land on main via the Release PR. Open a PR
      # back to protected develop or the next cycle starts from a stale version.
      - name: Open main → develop sync PR
        if: github.ref_name == 'main' && steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --state open --base develop --head main \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            pr=$(gh pr create \
              --base develop \
              --head main \
              --title "chore: sync release $TAG back to develop" \
              --body "Syncs the released version, manifest, and changelog from main." \
              | grep -o '[0-9]*$')
          fi
          # The sync PR carries only the version bump, manifest and CHANGELOG, so
          # it merges itself. develop has no required checks, which makes GitHub
          # reject --auto on an already-mergeable PR -- merge outright instead.
          gh pr merge "$pr" --auto --merge || gh pr merge "$pr" --merge
          echo "Sync PR #$pr queued for merge."
